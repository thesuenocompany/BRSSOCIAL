name: Deploy Brothers Tavern management admin
on:
  push:
    branches: [netlify-admin-management-20260829]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Brothers Tavern admin build
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/brothers-admin.zip "https://at.adobe.com/pIgpmmgO75ynDTEj"
          mkdir -p site
          unzip -q /tmp/brothers-admin.zip -d site
          test -f site/index.html
          test -f site/admin.html
