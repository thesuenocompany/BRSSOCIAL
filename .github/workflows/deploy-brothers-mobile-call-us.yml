name: Deploy Brothers Tavern mobile Call Us

on:
  push:
    branches:
      - netlify-mobile-call-us-20260831

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Brothers Tavern build
        run: |
          mkdir -p /tmp/brothers-site
          curl -L --fail "https://at.adobe.com/fQ6iQ12E0QTDzAdZ" -o /tmp/brothers-site/site.zip
          unzip -q /tmp/brothers-site/site.zip -d /tmp/brothers-site/deploy
      - name: Deploy to Netlify staging
        working-directory: /tmp/brothers-site/deploy
        run: >-
          npx -y @netlify/mcp@latest
          --site-id 0b1eb2b5-8e49-4e0f-aa5b-9cd0453d8fd4
