name: Deploy Brothers Tavern sports fix

on:
  push:
    branches:
      - netlify-sports-fix-20260828

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Brothers Tavern sports fix
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/brothers.zip "https://at.adobe.com/VjxeSTqT71Mnnbcq"
          mkdir -p site
          unzip -q /tmp/brothers.zip -d site
          test -f site/index.html
          test -f site/sports.html
          test -f site/sports-settings.html
