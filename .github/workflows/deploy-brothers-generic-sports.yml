name: Deploy Brothers Tavern generic sports manager
on:
  push:
    branches: [netlify-generic-sports-manager-20260829]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Brothers Tavern build
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/brothers.zip "https://at.adobe.com/l9n3jdOFrZGIVCq0"
          mkdir -p site
          unzip -q /tmp/brothers.zip -d site
          test -f site/index.html
          test -f site/sports-settings.html
