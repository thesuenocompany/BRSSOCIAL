name: Deploy final approved Brothers Tavern staging

on:
  push:
    branches:
      - netlify-final-approved-20260828b

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download final approved Brothers Tavern build
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/brothers-tavern-final.zip \
            "https://at.adobe.com/0cot8w5sL6yu1Pi3"
          mkdir -p site
          unzip -q /tmp/brothers-tavern-final.zip -d site
          test -f site/index.html
          test -f site/menu.html
          test -f site/assets/css/site-20260828.css
          test -f site/assets/img/home-master-approved.webp

      - name: Deploy to Netlify staging
        working-directory: site
        run: |
          npx -y @netlify/mcp@latest \
            --site-id 0b1eb2b5-8e49-4e0f-aa5b-9cd0453d8fd4 \
